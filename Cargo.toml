[workspace]
resolver = "2"
members = [".", "crates/human_connectome_rnn", "crates/krylov_ds", "crates/spectral_hypergraph", "crates/nbsc"]
default-members = ["."]
exclude = ["frontend"]

[package]
name = "enterprise_suite"
version = "0.3.0"
edition = "2021"
default-run = "enterprise_suite"
description = "Enterprise suite: CRM, Project Management, GRC, Assets, QMS, EHS, Documents, Finance, HR, Risk and Supply Chain (logistics, warehouse, procurement, resilience, cognitive planning) on Axum + SeaORM + PostgreSQL"

[lib]
name = "enterprise_suite"
path = "src/lib.rs"

[[bin]]
name = "enterprise_suite"
path = "src/main.rs"

[[bin]]
name = "dataset_eval"
path = "src/bin/dataset_eval.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-json", "with-uuid", "with-rust_decimal"] }
rust_decimal = { version = "1", features = ["serde", "serde-with-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
jsonwebtoken = "9"
argon2 = "0.5"
sha2 = "0.10"
hex = "0.4"
csv = "1"
anyhow = "1"
thiserror = "1"
nalgebra = "0.33"
hcrnn = { package = "human_connectome_rnn", path = "crates/human_connectome_rnn" }
spectral_hypergraph = { path = "crates/spectral_hypergraph" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
